name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: davrzin
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Keep snake inside grid
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const files = [
            "dist/github-contribution-grid-snake.svg",
            "dist/github-contribution-grid-snake-dark.svg"
          ];

          for (const file of files) {
            let svg = fs.readFileSync(file, "utf8");

            svg = svg.replace(
              /<svg viewBox="[^"]+" width="[^"]+" height="[^"]+"/,
              '<svg viewBox="0 0 864 112" width="864" height="112" style="overflow:hidden"'
            );

            svg = svg.replace(/translate\(([-\d.]+)px,-16px\)/g, "translate($1px,0px)");
            svg = svg.replace(/translate\(([-\d.]+)px,112px\)/g, "translate($1px,96px)");

            fs.writeFileSync(file, svg);
          }
          NODE

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
